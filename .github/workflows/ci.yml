name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]   # the browser UI tests need Node 22 and skip themselves on older versions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: docker version && docker compose version
      - run: google-chrome --version || echo 'no google-chrome on this runner'
      - run: npm test

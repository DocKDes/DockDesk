name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write      # create the GitHub release
  id-token: write      # npm provenance (links the npm package to this exact build)
  attestations: write  # signed build attestation for the release files (Sigstore); `gh attestation verify` checks it
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Tag must match package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: CHANGELOG has a section for this version
        run: |
          VER=$(node -p "require('./package.json').version")
          grep -q "^## $VER " CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## $VER (date)' section: rename the Unreleased heading before tagging"; exit 1; }
      - run: npm test
        env:
          CI: 'true'
      - run: sh packaging/release.sh
      - run: sh packaging/smoke-test.sh .
      - name: Attest the release files (signed proof of which workflow built them)
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/release/*.deb
            dist/release/*.tar.gz
            dist/release/SHA256SUMS
      - name: GitHub release (safe to re-run)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/release/* --title "DockDesk ${GITHUB_REF_NAME#v}" --generate-notes
          fi
      - name: Publish to npm (safe to re-run)
        if: env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VER=$(node -p "require('./package.json').version")
          if npm view "dockdesk@$VER" version >/dev/null 2>&1; then
            echo "dockdesk@$VER is already on npm: nothing to do"
          else
            npm publish --provenance --access public
          fi
      - name: npm publish skipped
        if: env.NPM_TOKEN == ''
        run: echo "::notice::The NPM_TOKEN secret is not set, so nothing was published to npm. The GitHub release was still created."
